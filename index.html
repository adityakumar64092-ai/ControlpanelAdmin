<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Firebase Device Controller</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px;
  }
  .container { max-width: 1300px; margin: 0 auto; }
  h1 { color: #38bdf8; margin-bottom: 8px; font-size: 26px; }
  .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 13px; }

  .setup-box {
    background: #1e293b; padding: 28px; border-radius: 12px;
    max-width: 600px; margin: 60px auto; border: 1px solid #334155;
  }
  .setup-box h2 { color: #38bdf8; margin-bottom: 16px; font-size: 20px; }
  .setup-box label {
    display: block; font-size: 12px; color: #94a3b8;
    margin-bottom: 6px; margin-top: 14px; text-transform: uppercase;
  }
  input, textarea {
    width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #334155;
    background: #0f172a; color: #e2e8f0; font-size: 14px; font-family: monospace;
  }
  input:focus, textarea:focus { outline: none; border-color: #38bdf8; }
  textarea { min-height: 140px; resize: vertical; }
  button {
    padding: 12px 20px; border-radius: 8px; border: none;
    background: #38bdf8; color: #0f172a; font-weight: 600; font-size: 14px;
    cursor: pointer; transition: 0.2s;
  }
  button:hover { background: #0ea5e9; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .full-btn { width: 100%; margin-top: 20px; padding: 14px; font-size: 15px; }

  .toolbar {
    display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center;
  }
  .toolbar input { flex: 1; min-width: 200px; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-secondary:hover { background: #475569; }
  .btn-danger { background: #ef4444; color: white; }
  .btn-danger:hover { background: #dc2626; }

  .stats { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat { background: #1e293b; padding: 14px 22px; border-radius: 8px; border: 1px solid #334155; }
  .stat-value { font-size: 22px; font-weight: 700; color: #38bdf8; }
  .stat-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; }

  .device-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px;
  }
  .device-card {
    background: #1e293b; border-radius: 10px; padding: 14px;
    border: 1px solid #334155; transition: 0.3s;
  }
  .device-card.online { border-left: 4px solid #22c55e; }
  .device-card.offline { border-left: 4px solid #ef4444; opacity: 0.85; }

  .device-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
  .device-name { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .device-id { font-size: 10px; color: #64748b; font-family: monospace; }
  .status-badge {
    padding: 3px 9px; border-radius: 20px; font-size: 10px;
    font-weight: 600; text-transform: uppercase;
  }
  .badge-online { background: #22c55e22; color: #22c55e; }
  .badge-offline { background: #ef444422; color: #ef4444; }

  .device-info { display: flex; gap: 10px; margin: 8px 0; font-size: 11px; color: #94a3b8; }
  .device-actions { display: flex; gap: 6px; margin-top: 10px; }
  .device-actions button { flex: 1; padding: 7px; font-size: 12px; border-radius: 6px; }
  .btn-online { background: #22c55e; color: white; }
  .btn-online:hover { background: #16a34a; }
  .btn-offline { background: #ef4444; color: white; }
  .btn-offline:hover { background: #dc2626; }

  .conn-status {
    display: inline-block; padding: 4px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 600; margin-left: 10px;
  }
  .conn-connected { background: #22c55e22; color: #22c55e; }
  .conn-disconnected { background: #ef444422; color: #ef4444; }
  .conn-connecting { background: #f59e0b22; color: #f59e0b; }
  .hidden { display: none !important; }

  .toast {
    position: fixed; bottom: 20px; right: 20px; background: #1e293b;
    padding: 14px 18px; border-radius: 8px; border: 1px solid #38bdf8;
    font-size: 13px; z-index: 999; max-width: 320px;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setupScreen" class="setup-box">
  <h2>🔥 Firebase Setup</h2>
  <p class="subtitle">Ek baar setup karein, phir seedha control panel khulega</p>

  <label>Firebase Realtime Database URL</label>
  <input type="text" id="dbUrl" placeholder="https://your-project-default-rtdb.firebaseio.com" />

  <label>Firebase API Key (optional — agar auth enabled hai)</label>
  <input type="text" id="apiKey" placeholder="AIzaSy..." />

  <label>Node Path (jahan aapka data hai)</label>
  <input type="text" id="nodePath" placeholder="All_User/Info" value="All_User/Info" />

  <button class="full-btn" onclick="connectFirebase()">Connect & Load Devices</button>
  <p id="setupError" style="color:#ef4444;margin-top:12px;font-size:13px;"></p>
</div>

<!-- CONTROL PANEL -->
<div id="appScreen" class="container hidden">
  <h1>📱 Device Controller <span id="connBadge" class="conn-status conn-connecting">Connecting...</span></h1>
  <p class="subtitle" id="dbInfo">—</p>

  <div class="stats">
    <div class="stat"><div class="stat-value" id="totalCount">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" style="color:#22c55e" id="onlineCount">0</div><div class="stat-label">Online</div></div>
    <div class="stat"><div class="stat-value" style="color:#ef4444" id="offlineCount">0</div><div class="stat-label">Offline</div></div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Search device..." oninput="renderDevices()" />
    <button class="btn-secondary" onclick="setAll('Online')">All Online</button>
    <button class="btn-secondary" onclick="setAll('Offline')">All Offline</button>
    <button class="btn-secondary" onclick="addDevice()">+ Add Device</button>
    <button class="btn-danger" onclick="disconnect()">Disconnect</button>
  </div>

  <div class="device-grid" id="deviceGrid"></div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, update, set, get }
  from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

// ---- GLOBAL STATE ----
let db = null;
let nodePath = 'All_User/Info';
let devices = {};

// ============================================================
// CONNECT TO FIREBASE
// ============================================================
window.connectFirebase = async function () {
  const url = document.getElementById('dbUrl').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  nodePath = document.getElementById('nodePath').value.trim() || 'All_User/Info';
  const errEl = document.getElementById('setupError');

  if (!url) { errEl.textContent = '❌ Database URL required'; return; }
  errEl.textContent = '';

  try {
    const config = { databaseURL: url };
    if (apiKey) config.apiKey = apiKey;

    const app = initializeApp(config);
    db = getDatabase(app);

    // Test connection by reading once
    const snap = await get(ref(db, nodePath));
    if (!snap.exists()) {
      errEl.textContent = `⚠️ Node "${nodePath}" khali hai. Kuch devices nahi mile.`;
    }

    // Save to localStorage for next time
    localStorage.setItem('fb_config', JSON.stringify({ url, apiKey, nodePath }));

    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('dbInfo').textContent = `Connected: ${url} → ${nodePath}`;

    startRealtimeSync();
  } catch (e) {
    errEl.textContent = '❌ Error: ' + e.message;
    console.error(e);
  }
};

// ============================================================
// REAL-TIME LISTENER — yahi magic hai
// ============================================================
function startRealtimeSync() {
  const devicesRef = ref(db, nodePath);

  onValue(devicesRef, (snapshot) => {
    // Connection badge
    const badge = document.getElementById('connBadge');
    badge.className = 'conn-status conn-connected';
    badge.textContent = 'Live';

    devices = snapshot.val() || {};

    // Normalize: agar kisi device mein status nahi hai to default Offline
    Object.keys(devices).forEach(k => {
      if (!devices[k].status) devices[k].status = 'Offline';
    });

    renderDevices();
    updateStats();
  }, (error) => {
    const badge = document.getElementById('connBadge');
    badge.className = 'conn-status conn-disconnected';
    badge.textContent = 'Error';
    console.error('Firebase error:', error);
  });

  // Monitor connection state
  const connectedRef = ref(db, '.info/connected');
  onValue(connectedRef, (snap) => {
    const badge = document.getElementById('connBadge');
    if (snap.val() === true) {
      badge.className = 'conn-status conn-connected';
      badge.textContent = 'Live';
    } else {
      badge.className = 'conn-status conn-disconnected';
      badge.textContent = 'Offline';
    }
  });
}

// ============================================================
// CHANGE DEVICE STATUS (single device)
// ============================================================
async function setDeviceStatus(deviceId, status) {
  if (!db) return;
  try {
    await update(ref(db, `${nodePath}/${deviceId}`), { status });
    showToast(`✅ ${deviceId.slice(0, 10)}... → ${status}`);
  } catch (e) {
    showToast('❌ Error: ' + e.message);
  }
}
window.setDeviceStatus = setDeviceStatus;

// ============================================================
// CHANGE ALL DEVICES
// ============================================================
window.setAll = async function (status) {
  if (!db) return;
  const updates = {};
  Object.keys(devices).forEach(id => {
    updates[`${nodePath}/${id}/status`] = status;
  });
  try {
    await update(ref(db), updates);
    showToast(`✅ All devices → ${status}`);
  } catch (e) {
    showToast('❌ Error: ' + e.message);
  }
};

// ============================================================
// ADD NEW DEVICE
// ============================================================
window.addDevice = async function () {
  const id = prompt('Device ID (unique):');
  if (!id) return;
  const name = prompt('Device Name:') || 'New Device';
  try {
    await set(ref(db, `${nodePath}/${id}`), {
      Id: id,
      Name: name,
      Battery: '100',
      did: id,
      status: 'Offline'
    });
    showToast('✅ Device added');
  } catch (e) {
    showToast('❌ Error: ' + e.message);
  }
};

// ============================================================
// RENDER
// ============================================================
window.renderDevices = function () {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const grid = document.getElementById('deviceGrid');
  grid.innerHTML = '';

  const entries = Object.entries(devices);
  if (entries.length === 0) {
    grid.innerHTML = '<p style="color:#64748b;padding:20px;">No devices found. "+ Add Device" se pehla device add karein.</p>';
    return;
  }

  entries.forEach(([id, d]) => {
    const name = d.Name || 'Unnamed';
    if (search && !name.toLowerCase().includes(search) &&
        !id.toLowerCase().includes(search) &&
        !(d.did || '').toLowerCase().includes(search)) return;

    const isOnline = d.status === 'Online';
    const card = document.createElement('div');
    card.className = `device-card ${isOnline ? 'online' : 'offline'}`;
    card.innerHTML = `
      <div class="device-header">
        <div>
          <div class="device-name">${escapeHtml(name)}</div>
          <div class="device-id">${escapeHtml(d.did || id)}</div>
        </div>
        <span class="status-badge ${isOnline ? 'badge-online' : 'badge-offline'}">${d.status}</span>
      </div>
      <div class="device-info">
        <span>🔋 ${d.Battery || '?'}%</span>
        <span>🆔 ${id.slice(0, 12)}...</span>
      </div>
      <div class="device-actions">
        <button class="btn-online" onclick="setDeviceStatus('${id}', 'Online')" ${isOnline ? 'disabled' : ''}>Online</button>
        <button class="btn-offline" onclick="setDeviceStatus('${id}', 'Offline')" ${!isOnline ? 'disabled' : ''}>Offline</button>
      </div>
    `;
    grid.appendChild(card);
  });
};

function updateStats() {
  const all = Object.values(devices);
  document.getElementById('totalCount').textContent = all.length;
  document.getElementById('onlineCount').textContent = all.filter(d => d.status === 'Online').length;
  document.getElementById('offlineCount').textContent = all.filter(d => d.status === 'Offline').length;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ============================================================
// DISCONNECT
// ============================================================
window.disconnect = function () {
  localStorage.removeItem('fb_config');
  location.reload();
};

// ============================================================
// AUTO-LOAD SAVED CONFIG
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('fb_config');
  if (saved) {
    try {
      const c = JSON.parse(saved);
      document.getElementById('dbUrl').value = c.url || '';
      document.getElementById('apiKey').value = c.apiKey || '';
      document.getElementById('nodePath').value = c.nodePath || 'All_User/Info';
    } catch (e) { /* ignore */ }
  }
});
</script>

</body>
</html>
