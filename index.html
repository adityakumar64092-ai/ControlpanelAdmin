<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Device Controller</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
  .container { max-width: 1300px; margin: 0 auto; }
  h1 { color: #38bdf8; margin-bottom: 8px; font-size: 24px; }
  .subtitle { color: #94a3b8; margin-bottom: 20px; font-size: 13px; }
  .setup-box { background: #1e293b; padding: 26px; border-radius: 12px; max-width: 640px; margin: 40px auto; border: 1px solid #334155; }
  .setup-box h2 { color: #38bdf8; margin-bottom: 8px; font-size: 19px; }
  .setup-box label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; margin-top: 14px; text-transform: uppercase; font-weight: 600; }
  input { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; font-family: monospace; }
  input:focus { outline: none; border-color: #38bdf8; }
  button { padding: 12px 20px; border-radius: 8px; border: none; background: #38bdf8; color: #0f172a; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
  button:hover:not(:disabled) { background: #0ea5e9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .full-btn { width: 100%; margin-top: 18px; padding: 14px; font-size: 15px; }
  .status-msg { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; display: none; }
  .status-info { background: #1e3a8a33; color: #93c5fd; border: 1px solid #3b82f655; display: block; }
  .status-error { background: #7f1d1d33; color: #fca5a5; border: 1px solid #dc262655; display: block; }
  .status-success { background: #14532d33; color: #86efac; border: 1px solid #22c55e55; display: block; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .toolbar input { flex: 1; min-width: 180px; }
  .btn-secondary { background: #334155; color: #e2e8f0; }
  .btn-danger { background: #ef4444; color: white; }
  .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { background: #1e293b; padding: 12px 20px; border-radius: 8px; border: 1px solid #334155; }
  .stat-value { font-size: 20px; font-weight: 700; color: #38bdf8; }
  .stat-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
  .device-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .device-card { background: #1e293b; border-radius: 10px; padding: 14px; border: 1px solid #334155; transition: 0.2s; }
  .device-card.online { border-left: 4px solid #22c55e; }
  .device-card.offline { border-left: 4px solid #ef4444; opacity: 0.9; }
  .device-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; gap: 8px; }
  .device-name { font-weight: 600; font-size: 13px; margin-bottom: 2px; word-break: break-word; }
  .device-id { font-size: 10px; color: #64748b; font-family: monospace; word-break: break-all; }
  .status-badge { padding: 3px 8px; border-radius: 20px; font-size: 10px; font-weight: 600; text-transform: uppercase; white-space: nowrap; }
  .badge-online { background: #22c55e22; color: #22c55e; }
  .badge-offline { background: #ef444422; color: #ef4444; }
  .device-info { display: flex; gap: 10px; margin: 8px 0; font-size: 11px; color: #94a3b8; }
  .device-actions { display: flex; gap: 6px; margin-top: 8px; }
  .device-actions button { flex: 1; padding: 7px; font-size: 12px; border-radius: 6px; }
  .btn-online { background: #22c55e; color: white; }
  .btn-offline { background: #ef4444; color: white; }
  .conn-status { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; margin-left: 8px; }
  .conn-connected { background: #22c55e22; color: #22c55e; }
  .conn-disconnected { background: #ef444422; color: #ef4444; }
  .conn-connecting { background: #f59e0b22; color: #f59e0b; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="setupScreen" class="setup-box">
  <h2>🔥 Firebase Connection Setup</h2>
  <p class="subtitle" style="margin-bottom:0;">Agar URL connect nahi hota, to bhi panel bina error ke khulega.</p>

  <label>Firebase Realtime Database URL</label>
  <input type="text" id="dbUrl" placeholder="https://maxjoker98-d9bcb-default-rtdb.firebaseio.com" />

  <label>Node Path</label>
  <input type="text" id="nodePath" value="All_User/Info" />

  <button class="full-btn" id="connectBtn" onclick="connectAndSetup()">Connect & Upload Data</button>
  <div id="statusMsg" class="status-msg"></div>
</div>

<div id="appScreen" class="container hidden">
  <h1>📱 Device Controller <span id="connBadge" class="conn-status conn-connecting">Connecting...</span></h1>
  <p class="subtitle" id="dbInfo">—</p>
  <div class="stats">
    <div class="stat"><div class="stat-value" id="totalCount">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-value" style="color:#22c55e" id="onlineCount">0</div><div class="stat-label">Online</div></div>
    <div class="stat"><div class="stat-value" style="color:#ef4444" id="offlineCount">0</div><div class="stat-label">Offline</div></div>
  </div>
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Search device..." oninput="renderDevices()" />
    <button class="btn-secondary" onclick="setAll('Online')">All Online</button>
    <button class="btn-secondary" onclick="setAll('Offline')">All Offline</button>
    <button class="btn-danger" onclick="disconnect()">Disconnect</button>
  </div>
  <div class="device-grid" id="deviceGrid"></div>
</div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getDatabase, ref, onValue, update, set, get } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";

const DEFAULT_DATA = {
  "00029a1756388529281": { "Battery": "96", "Id": "00029a1756388529281", "Name": "OnePlus Nord 2T 5G", "did": "4a731d81b1db0b58", "status": "Online" },
  "00031a1756388966050": { "Battery": "16", "Id": "00031a1756388966050", "Name": "ĐJ's S23 Ultra", "did": "0a33ed8b089a163e", "status": "Online" },
  "00065a1756401015923": { "Battery": "93", "Id": "00065a1756401015923", "Name": "realme 14 Pro+ 5G", "did": "fe7c10d2341ee8a3", "status": "Online" },
  "00138a1756525555297": { "Battery": "79", "Id": "00138a1756525555297", "Name": "V2315", "did": "4d191af7e613011e", "status": "Online" },
  "00153a1756552941803": { "Battery": "20", "Id": "00153a1756552941803", "Name": "OnePlus Nord CE4", "did": "b5a5989998faa031", "status": "Online" },
  "00169a1756568093310": { "Battery": "100", "Id": "00169a1756568093310", "Name": "I2127", "did": "b316e815b590aa21", "status": "Online" },
  "00196a1756627928638": { "Battery": "39", "Id": "00196a1756627928638", "Name": "VINAYAK's S20 FE", "did": "326f851a5eeaea37", "status": "Online" },
  "00256a1756722455180": { "Battery": "3", "Id": "00256a1756722455180", "Name": "V2351", "did": "08279d429beaf249", "status": "Online" },
  "00259a1756728563832": { "Battery": "84", "Id": "00259a1756728563832", "Name": "OnePlus Nord 2T 5G", "did": "18fff957a8a4a558", "status": "Online" },
  "00281a1756776773303": { "Battery": "52", "Id": "00281a1756776773303", "Name": "V2205", "did": "4e39c0ead8a42f1b", "status": "Online" },
  "00303a1756806598319": { "Battery": "30", "Id": "00303a1756806598319", "Name": "V2351", "did": "a49c2d126843c288", "status": "Online" },
  "00307a1756811078910": { "Battery": "58", "Id": "00307a1756811078910", "Name": "realme 11x 5G", "did": "7a0f6458b1bf6567", "status": "Online" },
  "00340a1757086399125": { "Battery": "38", "Id": "00340a1757086399125", "Name": "V2415", "did": "ca782ba4d0ab8839", "status": "Online" },
  "00347a1757087320485": { "Battery": "66", "Id": "00347a1757087320485", "Name": "realme C33", "did": "f4fb7f6429574686", "status": "Online" },
  "00390a1757153456898": { "Battery": "52", "Id": "00390a1757153456898", "Name": "OnePlus Nord CE 3 Lite 5G", "did": "ff143ef316bb59d1", "status": "Offline" },
  "00408a1757173731858": { "Battery": "81", "Id": "00408a1757173731858", "Name": "OPPO A16", "did": "b5dea82c659a5842", "status": "Online" },
  "00495a1757246893574": { "Battery": "51", "Id": "00495a1757246893574", "Name": "realme 8s 5G", "did": "799abe138da54f24", "status": "Online" },
  "00522a1757289744537": { "Battery": "70", "Id": "00522a1757289744537", "Name": "realme C30", "did": "d6b3a6cbd0d9fe77", "status": "Offline" },
  "00528a1757295774780": { "Battery": "94", "Id": "00528a1757295774780", "Name": "V2407", "did": "12345eae474d93fc", "status": "Online" },
  "00529a1757295811695": { "Battery": "32", "Id": "00529a1757295811695", "Name": "V2416", "did": "c21f4e810634a69f", "status": "Online" },
  "00538a1757317852217": { "Battery": "67", "Id": "00538a1757317852217", "Name": "Galaxy A16 5G", "did": "377a8e8b706de8e5", "status": "Online" },
  "00642a1757515373932": { "Battery": "97", "Id": "00642a1757515373932", "Name": "RMX1925", "did": "2f9959a59b5a2bb7", "status": "Online" },
  "00684a1757640376434": { "Battery": "25", "Id": "00684a1757640376434", "Name": "Satyaveer's A04s", "did": "ee6592c1d8c4b927", "status": "Online" },
  "00685a1757640460985": { "Battery": "76", "Id": "00685a1757640460985", "Name": "Jai's A22", "did": "4b969188f0ac8da7", "status": "Online" }
};

let app = null;
let db = null;
let nodePath = 'All_User/Info';
let devices = {};
let unsubscribe = null;
let isOfflineMode = false;

function setStatusMsg(msg, type = 'info') {
  const el = document.getElementById('statusMsg');
  el.className = 'status-msg status-' + type;
  el.innerHTML = msg;
}

window.connectAndSetup = async function () {
  let inputUrl = document.getElementById('dbUrl').value.trim();
  nodePath = document.getElementById('nodePath').value.trim() || 'All_User/Info';
  const btn = document.getElementById('connectBtn');

  if (!inputUrl) { setStatusMsg('URL daalein.', 'error'); return; }
  if (!inputUrl.startsWith('http')) { inputUrl = 'https://' + inputUrl; }

  btn.disabled = true;
  btn.textContent = 'Connecting...';
  setStatusMsg('⏳ Firebase se connect kar raha hoon...', 'info');

  try {
    if (app) { try { await deleteApp(app); } catch (e) {} }
    
    app = initializeApp({ databaseURL: inputUrl }, 'ctrl-' + Date.now());
    db = getDatabase(app);

    // Correct way to check DB read permission
    const snap = await get(ref(db, nodePath));

    // Agar yahan tak aaya matlab connection aur rules sahi hain!
    setStatusMsg('✅ Firebase Connected! Data check ho raha hai...', 'success');
    
    if (!snap.exists() || Object.keys(snap.val() || {}).length === 0) {
      await set(ref(db, nodePath), DEFAULT_DATA);
    }

    localStorage.setItem('fb_config', JSON.stringify({ url: inputUrl, nodePath }));
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('dbInfo').textContent = 'Connected: ' + inputUrl;
    
    startRealtimeSync();
    isOfflineMode = false;

  } catch (err) {
    // ERROR BYPASS: Agar Firebase fail hua, toh bina error dikhaye Offline Mode chalu karo
    isOfflineMode = true;
    
    let localData = localStorage.getItem('local_devices');
    devices = localData ? JSON.parse(localData) : DEFAULT_DATA;

    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('dbInfo').textContent = '⚠️ Offline Mode (Firebase Connect Nahi Hua)';
    
    const badge = document.getElementById('connBadge');
    badge.className = 'conn-status conn-disconnected';
    badge.textContent = 'Offline';

    renderDevices();
    updateStats();
  }
};

function startRealtimeSync() {
  const badge = document.getElementById('connBadge');
  onValue(ref(db, '.info/connected'), (s) => {
    badge.className = s.val() === true ? 'conn-status conn-connected' : 'conn-status conn-disconnected';
    badge.textContent = s.val() === true ? 'Live' : 'Offline';
  });
  
  if (unsubscribe) unsubscribe();
  unsubscribe = onValue(ref(db, nodePath), (snapshot) => {
    devices = snapshot.val() || {};
    Object.keys(devices).forEach(k => { if (!devices[k].status) devices[k].status = 'Offline'; });
    renderDevices(); updateStats();
  }, (error) => { /* Background error ignore */ });
}

window.setDeviceStatus = async function (deviceId, status) {
  if (devices[deviceId]) {
      devices[deviceId].status = status;
      renderDevices(); updateStats();
  }

  if (!isOfflineMode && db) {
    try { await update(ref(db, nodePath + '/' + deviceId), { status }); } catch(e) {}
  } else {
    localStorage.setItem('local_devices', JSON.stringify(devices));
  }
};

window.setAll = async function (status) {
  Object.keys(devices).forEach(id => { devices[id].status = status; });
  renderDevices(); updateStats();

  if (!isOfflineMode && db) {
    const updates = {};
    Object.keys(devices).forEach(id => { updates[nodePath + '/' + id + '/status'] = status; });
    try { await update(ref(db), updates); } catch(e) {}
  } else {
    localStorage.setItem('local_devices', JSON.stringify(devices));
  }
};

window.renderDevices = function () {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  const grid = document.getElementById('deviceGrid');
  grid.innerHTML = '';
  const entries = Object.entries(devices);
  if (entries.length === 0) { grid.innerHTML = '<p style="color:#64748b;padding:20px;">No devices.</p>'; return; }
  
  entries.forEach(([id, d]) => {
    const name = d.Name || 'Unnamed';
    if (search && !name.toLowerCase().includes(search) && !id.toLowerCase().includes(search)) return;
    const isOnline = d.status === 'Online';
    const card = document.createElement('div');
    card.className = 'device-card ' + (isOnline ? 'online' : 'offline');
    card.innerHTML = 
      '<div class="device-header"><div><div class="device-name">' + esc(name) + '</div><div class="device-id">' + esc(d.did || id) + '</div></div>' +
      '<span class="status-badge ' + (isOnline ? 'badge-online' : 'badge-offline') + '">' + d.status + '</span></div>' +
      '<div class="device-info"><span>🔋 ' + esc(d.Battery || '?') + '%</span><span>🆔 ' + id.slice(0, 12) + '...</span></div>' +
      '<div class="device-actions"><button class="btn-online" ' + (isOnline ? 'disabled' : '') + ' onclick="setDeviceStatus(\'' + id + '\', \'Online\')">Online</button>' +
      '<button class="btn-offline" ' + (!isOnline ? 'disabled' : '') + ' onclick="setDeviceStatus(\'' + id + '\', \'Offline\')">Offline</button></div>';
    grid.appendChild(card);
  });
};

function updateStats() {
  const all = Object.values(devices);
  document.getElementById('totalCount').textContent = all.length;
  document.getElementById('onlineCount').textContent = all.filter(d => d.status === 'Online').length;
  document.getElementById('offlineCount').textContent = all.filter(d => d.status === 'Offline').length;
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

window.disconnect = function () { localStorage.clear(); location.reload(); };
</script>
</body>
</html>
