<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Device Panel</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0a0514; color: #fff; }
    
    /* Setup Screen */
    #setup { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
    input { padding: 12px; width: 100%; max-width: 400px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #a020f0; background: #120a22; color: #fff; }
    button { padding: 12px 20px; background: #a020f0; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    
    /* Panel */
    #panel { display: none; height: 100vh; flex-direction: column; }
    .header { display: flex; padding: 15px; background: #120a22; border-bottom: 2px solid #a020f0; justify-content: space-between; align-items: center; }
    .stats { display: flex; gap: 10px; font-size: 14px; }
    
    .controls { display: flex; padding: 10px; gap: 10px; }
    .controls input { margin: 0; padding: 8px; }
    .controls button { padding: 8px 15px; font-size: 12px; }
    
    .list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    
    /* Device Card */
    .card { background: #120a22; border: 1px solid #a020f0; border-radius: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    .card.online { border-left: 5px solid #00d4aa; }
    .card.offline { border-left: 5px solid #ff0055; }
    
    .info { display: flex; flex-direction: column; gap: 5px; }
    .name { font-weight: bold; font-size: 16px; }
    .id { font-size: 11px; color: #888; }
    .status { font-size: 12px; font-weight: bold; }
    .status.on { color: #00d4aa; }
    .status.off { color: #ff0055; }
    
    /* Toggle Button */
    .toggle-btn { padding: 10px 15px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; }
    .toggle-btn.on { background: #00d4aa; color: #000; }
    .toggle-btn.off { background: #ff0055; color: #fff; }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup">
    <h2 style="margin-bottom: 20px;">Firebase Connect</h2>
    <input type="text" id="fbUrl" placeholder="https://your-project.firebaseio.com">
    <button onclick="connect()">Connect</button>
</div>

<!-- MAIN PANEL -->
<div id="panel">
    <div class="header">
        <h3>Device Panel</h3>
        <div class="stats">
            <span>Total: <b id="cntTotal">0</b></span>
            <span>On: <b id="cntOn" style="color: #00d4aa;">0</b></span>
            <span>Off: <b id="cntOff" style="color: #ff0055;">0</b></span>
        </div>
        <button onclick="manualRefresh()">Refresh</button>
    </div>
    
    <div class="controls">
        <input type="text" id="search" placeholder="Search device..." oninput="render()">
        <button onclick="filterMode='all'; render()">All</button>
        <button onclick="filterMode='online'; render()">Online</button>
        <button onclick="filterMode='offline'; render()">Offline</button>
    </div>

    <!-- Yahan saare devices render honge -->
    <div class="list" id="deviceList"></div>
</div>

<script>
    let FB_URL = "";
    let devicesArray = [];
    let filterMode = "all";

    // Connect to Firebase
    function connect() {
        let url = document.getElementById("fbUrl").value.trim();
        if (!url) return alert("Firebase URL daalo!");
        
        FB_URL = url.replace(/\/$/, ""); // Remove trailing slash
        
        // UI switch
        document.getElementById("setup").style.display = "none";
        document.getElementById("panel").style.display = "flex";
        
        loadData();
        // Auto refresh every 3 seconds
        setInterval(loadData, 3000);
    }

    // Fetch data from Firebase
    async function loadData() {
        if (!FB_URL) return;
        try {
            // Fetching whole devices node
            let response = await fetch(FB_URL + "/devices.json");
            let data = await response.json();
            
            devicesArray = [];
            
            if (data) {
                // Loop through all keys (No limit)
                for (let key in data) {
                    if (data.hasOwnProperty(key)) {
                        let dev = data[key];
                        if (typeof dev === 'object' && dev !== null) {
                            devicesArray.push({
                                id: key,
                                name: dev.name || dev.deviceName || "Unknown Device",
                                status: dev.status === true || dev.status === "true", // Force boolean
                                phone: dev.phone || "-",
                                battery: dev.batteryRaw || "-"
                            });
                        }
                    }
                }
            }
            render();
        } catch (error) {
            console.log("Error fetching data:", error);
        }
    }

    // Show devices on screen
    function render() {
        let list = document.getElementById("deviceList");
        let searchTxt = document.getElementById("search").value.toLowerCase();
        
        // Filter
        let filtered = devicesArray.filter(d => {
            if (filterMode === "online" && !d.status) return false;
            if (filterMode === "offline" && d.status) return false;
            if (searchTxt && !(d.name.toLowerCase().includes(searchTxt) || d.id.toLowerCase().includes(searchTxt))) return false;
            return true;
        });

        // Sort Online First
        filtered.sort((a, b) => a.status === b.status ? 0 : a.status ? -1 : 1);

        // Update Stats
        let total = devicesArray.length;
        let on = devicesArray.filter(d => d.status).length;
        document.getElementById("cntTotal").innerText = total;
        document.getElementById("cntOn").innerText = on;
        document.getElementById("cntOff").innerText = total - on;

        // Generate HTML
        let html = "";
        filtered.forEach((d, index) => {
            html += `
                <div class="card ${d.status ? 'online' : 'offline'}">
                    <div class="info">
                        <div class="name">${index + 1}. ${d.name}</div>
                        <div class="id">${d.id}</div>
                        <div class="status ${d.status ? 'on' : 'off'}">${d.status ? '🟢 ONLINE' : '🔴 OFFLINE'}</div>
                    </div>
                    <button class="toggle-btn ${d.status ? 'on' : 'off'}" onclick="toggleStatus('${d.id}', ${d.status})">
                        Change
                    </button>
                </div>
            `;
        });
        
        list.innerHTML = html || "<p style='text-align:center; padding:20px;'>No devices found.</p>";
    }

    // Toggle (Control) device
    async function toggleStatus(id, currentStatus) {
        let newCmd = currentStatus ? "offline" : "online"; // Agar on hai to off karo, agar off hai to on karo
        
        // Optimistic UI update
        let dev = devicesArray.find(x => x.id === id);
        if(dev) {
            dev.status = !currentStatus;
            render();
        }

        try {
            // Firebase mein adminStatus save karo
            await fetch(FB_URL + "/devices/" + id + "/adminStatus.json", {
                method: "PUT",
                body: JSON.stringify(newCmd)
            });
            alert("Command bhej diya: " + newCmd.toUpperCase());
        } catch (e) {
            alert("Error sending command!");
            loadData(); // Revert on error
        }
    }

    // Manual Refresh Button
    function manualRefresh() {
        loadData();
    }
</script>
</body>
</html>
