<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Device Control Panel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap');
:root{
  --bg:#020205; --bg2:#0a0514; --bg3:#120a22; --bg4:#1a0f30; --bg5:#221440;
  --gold:#a020f0; --gold2:#bf55ec;
  --mint:#00d4aa; --rose:#ff0055; --cyan:#00d4ff;
  --text:#f0f0ff; --sub:#8a9bb4; --dim:#4a5b74;
  --border:rgba(160,32,240,.2); --border2:rgba(160,32,240,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-family:'Exo 2',sans-serif;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:3px}

@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* SETUP */
#setup{display:flex;align-items:center;justify-content:center;height:100vh;padding:24px;
  background:radial-gradient(circle at 20% 30%,rgba(160,32,240,.18),transparent 55%),
             radial-gradient(circle at 80% 70%,rgba(0,212,255,.12),transparent 55%),var(--bg)}
.setup-card{background:rgba(10,5,20,.88);backdrop-filter:blur(18px);
  border:1px solid var(--border2);border-radius:24px;padding:42px 40px;width:100%;max-width:460px;
  box-shadow:0 40px 100px rgba(0,0,0,.9);position:relative;overflow:hidden;animation:fadeUp .5s}
.setup-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#a020f0,#00d4ff,#a020f0);background-size:200%;
  animation:shimmer 3s linear infinite}
.setup-h{font-size:28px;font-weight:800;margin-bottom:8px}
.gold-word{background:linear-gradient(90deg,#00d4ff,#a020f0,#00d4ff);background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 2.5s}
.setup-sub{font-size:13px;color:var(--sub);margin-bottom:26px;line-height:1.6}
.fl{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--sub);margin-bottom:7px}
.fi{width:100%;padding:13px 16px;background:rgba(16,28,46,.8);
  border:1px solid rgba(0,212,255,.15);border-radius:12px;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:14px;outline:none;margin-bottom:16px;transition:border-color .2s}
.fi:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(0,212,255,.1)}
.fi::placeholder{color:var(--dim)}
.cta{width:100%;padding:15px;border:none;border-radius:12px;color:#020810;
  font-family:'Exo 2',sans-serif;font-size:15px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,#22e5ff,#00d4ff,#0088ff);
  box-shadow:0 6px 30px rgba(0,212,255,.4);transition:all .25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(0,212,255,.55)}
.s-err{color:var(--rose);font-size:12px;text-align:center;margin-top:14px;
  display:none;background:rgba(255,0,85,.08);border:1px solid rgba(255,0,85,.25);
  padding:10px 14px;border-radius:9px}

/* PANEL */
#panel{display:none;height:100vh;flex-direction:column}
#panel.open{display:flex}
.tb{background:linear-gradient(90deg,#080d14,#0c121c);border-bottom:1px solid var(--border);
  height:58px;display:flex;align-items:center;gap:14px;padding:0 20px;flex-shrink:0;position:relative}
.tb::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,212,255,.7),rgba(160,32,240,.5),transparent)}
.tb-logo{font-size:17px;font-weight:800}
.tb-gl{background:linear-gradient(90deg,#00d4ff,#a020f0,#00d4ff);background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 3s}
.tb-pills{display:flex;gap:8px;margin-left:16px}
.pill{font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px}
.p-t{background:rgba(0,212,255,.12);color:var(--cyan)}
.p-on{background:rgba(0,212,170,.12);color:var(--mint)}
.p-off{background:rgba(255,0,85,.1);color:var(--rose)}
.tb-spacer{flex:1}
.tb-btn{height:34px;padding:0 14px;background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;color:var(--sub);font-family:'Exo 2',sans-serif;font-size:12px;
  font-weight:700;cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:6px}
.tb-btn:hover{color:var(--text);border-color:var(--border2);background:var(--bg4)}
.tb-btn.refresh-btn{color:var(--cyan);border-color:rgba(0,212,255,.3)}
.tb-btn.refresh-btn:hover{background:rgba(0,212,255,.1)}
.tb-btn.spinning svg{animation:spin .6s linear infinite}
.tb-btn.save-all{color:var(--mint);border-color:rgba(0,212,170,.3)}
.tb-btn.save-all:hover{background:rgba(0,212,170,.1)}
.tb-btn.save-all:disabled{opacity:.4;cursor:not-allowed}

.body{display:flex;flex:1;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tab-body{flex:1;overflow-y:auto;padding:24px}

.toolbar{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap}
.search-box{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.search-box:focus-within{border-color:var(--gold)}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);
  font-family:'Exo 2',sans-serif;font-size:13px}
.search-box input::placeholder{color:var(--dim)}
.filter-btn{padding:9px 16px;background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;color:var(--sub);font-family:'Exo 2',sans-serif;font-size:12px;
  font-weight:700;cursor:pointer;transition:all .18s;white-space:nowrap}
.filter-btn.active{background:rgba(0,212,255,.15);border-color:rgba(0,212,255,.4);color:var(--cyan)}
.filter-btn:hover:not(.active){color:var(--text);border-color:var(--border2)}
.count-badge{margin-left:auto;font-size:11px;color:var(--dim);padding:8px 12px;
  background:var(--bg2);border:1px solid var(--border);border-radius:10px}

.sec-hdr{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--sub);margin-bottom:16px;display:flex;align-items:center;gap:12px}
.sec-hdr::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent)}

.dev-list{display:flex;flex-direction:column;gap:10px}
.dev-row{background:linear-gradient(145deg,var(--bg3),var(--bg2));
  border:1px solid var(--border);border-radius:14px;padding:16px 18px;
  display:flex;align-items:center;gap:14px;position:relative;transition:all .15s;
  animation:fadeUp .25s}
.dev-row:hover{border-color:var(--border2);transform:translateX(3px);
  box-shadow:0 8px 30px rgba(0,0,0,.5)}
.dev-row.online{border-left:3px solid var(--mint)}
.dev-row.offline{border-left:3px solid var(--rose)}
.dev-row.forced{box-shadow:0 0 0 1px rgba(0,212,255,.25) inset}

.dev-num{width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--bg4),var(--bg5));
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-family:'Share Tech Mono',monospace;font-size:15px;font-weight:700;
  color:var(--cyan);flex-shrink:0;box-shadow:inset 0 1px 0 rgba(0,212,255,.1)}

.dev-meta{flex:1;min-width:0}
.dev-n{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.dev-id{font-size:10px;color:var(--dim);font-family:'Share Tech Mono',monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dev-stats{display:flex;gap:18px;flex-shrink:0;margin-right:6px}
.dstat{text-align:left;min-width:70px}
.dstat-l{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.dstat-v{font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:110px}
.dstat-v.on{color:var(--mint)}
.dstat-v.off{color:var(--rose)}

.toggle-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0}
.toggle-lbl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.toggle-btn{position:relative;width:56px;height:30px;border-radius:30px;border:none;
  cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle-btn.on{background:linear-gradient(135deg,#00d4aa,#00d4ff);
  box-shadow:0 0 16px rgba(0,212,170,.45)}
.toggle-btn.off{background:rgba(255,0,85,.25);border:1px solid rgba(255,0,85,.4)}
.toggle-btn::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;
  border-radius:50%;background:#fff;transition:transform .2s;
  box-shadow:0 2px 6px rgba(0,0,0,.35)}
.toggle-btn.on::after{transform:translateX(26px)}
.toggle-btn:disabled{opacity:.4;cursor:not-allowed}

.save-btn{padding:9px 14px;background:rgba(0,212,170,.1);border:1px solid rgba(0,212,170,.3);
  border-radius:8px;color:var(--mint);font-family:'Exo 2',sans-serif;font-size:11px;
  font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0;display:flex;
  align-items:center;gap:5px}
.save-btn:hover{background:rgba(0,212,170,.22);border-color:rgba(0,212,170,.5)}
.save-btn:disabled{opacity:.4;cursor:not-allowed}
.save-btn.saved{background:rgba(0,212,170,.25);color:#fff}
.save-btn.save-btn-mini{padding:7px 12px;font-size:11px}

.clear-btn{padding:7px 12px;background:rgba(255,0,85,.08);border:1px solid rgba(255,0,85,.25);
  border-radius:8px;color:var(--rose);font-family:'Exo 2',sans-serif;font-size:11px;
  font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0}
.clear-btn:hover{background:rgba(255,0,85,.18)}

/* Bulk save bar */
.bulk-bar{position:sticky;bottom:16px;background:linear-gradient(135deg,var(--bg4),var(--bg3));
  border:1px solid var(--border2);border-radius:14px;padding:14px 18px;
  display:flex;align-items:center;gap:12px;margin-top:20px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);animation:fadeUp .3s}
.bulk-bar .info{flex:1;font-size:12px;color:var(--sub)}
.bulk-bar .info b{color:var(--cyan)}
.bulk-bar button{padding:11px 22px;background:linear-gradient(135deg,#00d4aa,#00d4ff);
  border:none;border-radius:10px;color:#020810;font-family:'Exo 2',sans-serif;
  font-size:13px;font-weight:800;cursor:pointer;transition:all .2s}
.bulk-bar button:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,212,170,.4)}
.bulk-bar button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bulk-bar .reset{padding:11px 18px;background:var(--bg3);border:1px solid var(--border);
  color:var(--sub);font-weight:700;border-radius:10px;cursor:pointer;font-family:'Exo 2',sans-serif;font-size:12px}
.bulk-bar .reset:hover{color:var(--text);border-color:var(--border2)}

.loading{display:flex;align-items:center;justify-content:center;padding:60px;
  color:var(--sub);font-size:13px;gap:12px}
.spinner{width:20px;height:20px;border-radius:50%;border:2px solid transparent;
  border-top-color:var(--gold);border-right-color:var(--cyan);animation:spin .8s linear infinite}
.empty{text-align:center;padding:80px 20px;color:var(--dim)}
.empty .ei{font-size:56px;margin-bottom:16px;opacity:.6}
.empty p{font-size:14px}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
  background:linear-gradient(135deg,var(--bg4),var(--bg3));border:1px solid var(--border2);
  color:var(--text);font-size:13px;font-weight:600;padding:12px 26px;border-radius:24px;
  z-index:999;opacity:0;transition:all .35s;pointer-events:none;white-space:nowrap;
  box-shadow:0 10px 36px rgba(0,0,0,.6)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:rgba(255,0,85,.5);color:var(--rose)}
.toast.success{border-color:rgba(0,212,170,.5);color:var(--mint)}

@media (max-width:720px){
  .dev-stats{display:none}
  .dev-num{width:32px;height:32px;font-size:12px}
  .toolbar{flex-direction:column;align-items:stretch}
  .save-btn{font-size:10px;padding:7px 10px}
  .clear-btn{font-size:10px;padding:6px 10px}
}
</style>
</head>
<body>

<div id="setup">
  <div class="setup-card">
    <div class="setup-h"><span class="gold-word">Device</span> Control Panel</div>
    <div class="setup-sub">Firebase se connect karo — saare devices online/offline karo</div>
    <label class="fl">Firebase Database URL</label>
    <input id="fbUrl" class="fi" placeholder="https://your-project.firebaseio.com" type="url"/>
    <label class="fl">API Key (optional)</label>
    <input id="fbKey" class="fi" placeholder="Firebase API key" type="text"/>
    <button type="button" class="cta" onclick="connect()">⚡ Connect →</button>
    <div class="s-err" id="serr"></div>
  </div>
</div>

<div id="panel">
  <div class="tb">
    <div class="tb-logo"><span class="tb-gl">Device</span> Panel</div>
    <div class="tb-pills">
      <span class="pill p-t" id="pillTot">Total: 0</span>
      <span class="pill p-on" id="pillOn">On: 0</span>
      <span class="pill p-off" id="pillOff">Off: 0</span>
    </div>
    <div class="tb-spacer"></div>
    <button class="tb-btn save-all" id="saveAllBtn" onclick="saveAllChanges()" disabled>
      💾 Save All Changes
    </button>
    <button class="tb-btn refresh-btn" id="refreshBtn" onclick="manualRefresh()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Refresh
    </button>
    <button class="tb-btn" onclick="disconnect()" style="color:var(--rose);border-color:rgba(255,0,85,.3)">Disconnect</button>
  </div>
  <div class="body">
    <div class="main">
      <div class="tab-body">
        <div class="toolbar">
          <div class="search-box">
            <span style="color:var(--dim)">🔍</span>
            <input id="searchInput" placeholder="Search device..." oninput="renderDevices()"/>
          </div>
          <button class="filter-btn active" id="fAll" onclick="setFilter('all')">All</button>
          <button class="filter-btn" id="fOn" onclick="setFilter('online')">🟢 Online</button>
          <button class="filter-btn" id="fOff" onclick="setFilter('offline')">🔴 Offline</button>
          <span class="count-badge" id="countBadge">0 / 0</span>
        </div>
        <div class="sec-hdr" id="secHdr">Devices</div>
        <div id="devList" class="dev-list">
          <div class="loading"><div class="spinner"></div> Loading...</div>
        </div>
        <div class="bulk-bar" id="bulkBar" style="display:none">
          <div class="info"><b id="pendingCount">0</b> changes pending — click Save All to apply</div>
          <button class="reset" onclick="discardChanges()">Discard</button>
          <button onclick="saveAllChanges()">💾 Save All</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toastEl"></div>

<script>
// ==========================================================
// STATE
// ==========================================================
let FB_URL = '';
let FB_KEY = '';
let allDevices = [];      // loaded from Firebase
let pendingChanges = {};  // { id: 'online' | 'offline' } — user ne toggle kiya
let pollTimer = null;
let filterMode = 'all';
let busyIds = new Set();
let isSavingAll = false;

// ==========================================================
// CONNECT
// ==========================================================
async function connect() {
  const url = document.getElementById('fbUrl').value.trim().replace(/\/+$/, '');
  const key = document.getElementById('fbKey').value.trim();
  const err = document.getElementById('serr');

  if (!url || !url.startsWith('http')) {
    err.textContent = 'Sahi Firebase URL daalo (https://... se)';
    err.style.display = 'block';
    return;
  }
  err.style.display = 'none';

  try {
    const res = await fetch(url + '/devices.json' + (key ? '?auth=' + key : ''));
    if (!res.ok) throw new Error('HTTP ' + res.status);
    await res.json();

    FB_URL = url; FB_KEY = key;
    document.getElementById('setup').style.display = 'none';
    document.getElementById('panel').classList.add('open');
    await loadDevices();
    startPolling();
    toast('✓ Connected', 'success');
  } catch (e) {
    err.textContent = 'Connection failed: ' + e.message;
    err.style.display = 'block';
  }
}

function disconnect() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  FB_URL = ''; FB_KEY = '';
  allDevices = []; pendingChanges = {}; busyIds.clear();
  document.getElementById('setup').style.display = 'flex';
  document.getElementById('panel').classList.remove('open');
}

// ==========================================================
// LOAD DEVICES (fast, with cache-bust)
// ==========================================================
async function loadDevices() {
  if (!FB_URL) return;
  try {
    const cacheBust = '&_=' + Date.now();
    const authStr = FB_KEY ? '?auth=' + FB_KEY + cacheBust : '?_=' + Date.now();
    const res = await fetch(FB_URL + '/devices.json' + authStr);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    allDevices = [];
    if (data && typeof data === 'object') {
      Object.keys(data).forEach(id => {
        const d = data[id];
        if (!d || typeof d !== 'object') return;

        const hasAdmin = d.adminStatus === 'online' || d.adminStatus === 'offline';

        // Pending change overrides server adminStatus
        let effectiveAdmin = d.adminStatus || null;
        if (pendingChanges.hasOwnProperty(id)) {
          effectiveAdmin = pendingChanges[id];
        }

        const isForced = (effectiveAdmin === 'online' || effectiveAdmin === 'offline');
        const shownOnline = isForced
          ? (effectiveAdmin === 'online')
          : !!d.status;

        allDevices.push({
          id: id,
          name: d.name || d.deviceName || d.model || ('Device ' + id.slice(0, 6)),
          phone: d.phone || d.mobNo || d.simNumber || '—',
          battery: d.batteryRaw != null ? String(d.batteryRaw)
                 : (d.batteryNum != null ? d.batteryNum + '%' : '—'),
          actualStatus: !!d.status,
          serverAdmin: d.adminStatus || null,  // what's on server
          pendingAdmin: pendingChanges[id] || null, // what user clicked
          isForced: isForced,
          shownOnline: shownOnline
        });
      });

      allDevices.sort((a, b) => {
        if (a.shownOnline !== b.shownOnline) return a.shownOnline ? -1 : 1;
        return String(b.id).localeCompare(String(a.id));
      });
    }
    renderDevices();
    renderStats();
    updateBulkBar();
  } catch (e) {
    console.error('Load failed:', e);
    toast('Load failed: ' + e.message, true);
  }
}

function startPolling() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if (busyIds.size > 0 || isSavingAll) return;
    if (Object.keys(pendingChanges).length > 0) return; // don't overwrite pending
    if (document.getElementById('panel').classList.contains('open')) {
      loadDevices();
    }
  }, 5000);
}

// ==========================================================
// RENDER
// ==========================================================
function renderDevices() {
  const list = document.getElementById('devList');
  const search = (document.getElementById('searchInput').value || '').toLowerCase().trim();

  let filtered = allDevices.filter(d => {
    if (filterMode === 'online' && !d.shownOnline) return false;
    if (filterMode === 'offline' && d.shownOnline) return false;
    if (search) {
      const hay = (d.name + ' ' + d.id + ' ' + d.phone).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  document.getElementById('secHdr').textContent =
    'Devices (' + filtered.length + (filtered.length !== allDevices.length ? ' of ' + allDevices.length : '') + ')';
  document.getElementById('countBadge').textContent = filtered.length + ' / ' + allDevices.length;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><div class="ei">📱</div><p>' +
      (search ? 'Search se match nahi hua'
              : (allDevices.length === 0 ? 'Koi device nahi mila' : 'Filter me koi device nahi')) +
      '</p></div>';
    return;
  }

  // Build all rows in one string — FAST for 100+ devices
  let html = '';
  for (let i = 0; i < filtered.length; i++) {
    const d = filtered[i];
    const serial = i + 1;
    const isBusy = busyIds.has(d.id);
    const hasPending = d.pendingAdmin !== null && d.pendingAdmin !== d.serverAdmin;

    html += `
    <div class="dev-row ${d.shownOnline ? 'online' : 'offline'} ${d.isForced ? 'forced' : ''}" data-id="${esc(d.id)}">
      <div class="dev-num">${serial}</div>

      <div class="dev-meta">
        <div class="dev-n">${esc(d.name)}</div>
        <div class="dev-id">${esc(d.id)}</div>
      </div>

      <div class="dev-stats">
        <div class="dstat">
          <div class="dstat-l">Phone</div>
          <div class="dstat-v">${esc(d.phone)}</div>
        </div>
        <div class="dstat">
          <div class="dstat-l">Battery</div>
          <div class="dstat-v">${esc(d.battery)}</div>
        </div>
        <div class="dstat">
          <div class="dstat-l">Status</div>
          <div class="dstat-v ${d.shownOnline ? 'on' : 'off'}">
            ${d.shownOnline ? 'Online' : 'Offline'}
            ${d.isForced ? ' 🔒' : ''}
          </div>
        </div>
      </div>

      ${d.isForced ? `<button class="clear-btn" onclick="event.stopPropagation();clearForce('${esc(d.id)}')" title="Force hatao">✕</button>` : ''}

      <div class="toggle-wrap">
        <div class="toggle-lbl">${d.shownOnline ? 'ON' : 'OFF'}</div>
        <button class="toggle-btn ${d.shownOnline ? 'on' : 'off'}"
                ${isBusy ? 'disabled' : ''}
                onclick="toggleDevice('${esc(d.id)}')"
                title="Click to ${d.shownOnline ? 'Offline' : 'Online'}"></button>
      </div>

      <button class="save-btn ${hasPending ? 'saved' : ''}"
              onclick="saveSingle('${esc(d.id)}')"
              ${isBusy || !hasPending ? 'disabled' : ''}>
        ${hasPending ? '💾 Save' : '✓ Saved'}
      </button>
    </div>`;
  }
  list.innerHTML = html;
}

function renderStats() {
  const tot = allDevices.length;
  const on = allDevices.filter(d => d.shownOnline).length;
  document.getElementById('pillTot').textContent = 'Total: ' + tot;
  document.getElementById('pillOn').textContent  = 'On: ' + on;
  document.getElementById('pillOff').textContent = 'Off: ' + (tot - on);
}

// ==========================================================
// FILTER
// ==========================================================
function setFilter(mode) {
  filterMode = mode;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
  renderDevices();
}

// ==========================================================
// TOGGLE — instant UI, pending change stored
// ==========================================================
function toggleDevice(id) {
  if (busyIds.has(id)) return;

  const dev = allDevices.find(x => x.id === id);
  if (!dev) return;

  // Toggle current SHOWN state
  const newOnline = !dev.shownOnline;
  const newStatus = newOnline ? 'online' : 'offline';

  // Set pending change
  pendingChanges[id] = newStatus;

  // Update UI instantly
  dev.pendingAdmin = newStatus;
  dev.shownOnline = newOnline;
  dev.isForced = true;

  renderDevices();
  renderStats();
  updateBulkBar();
}

// ==========================================================
// SAVE SINGLE DEVICE — writes to Firebase immediately
// ==========================================================
async function saveSingle(id) {
  if (!FB_URL || busyIds.has(id)) return;

  const dev = allDevices.find(x => x.id === id);
  if (!dev || !dev.pendingAdmin) return;

  const targetStatus = dev.pendingAdmin;
  busyIds.add(id);
  renderDevices();

  try {
    const url = FB_URL + '/devices/' + id + '/adminStatus.json' + (FB_KEY ? '?auth=' + FB_KEY : '');
    const res = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(targetStatus)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    // Success — clear pending, update server status locally
    delete pendingChanges[id];
    dev.serverAdmin = targetStatus;
    dev.pendingAdmin = null;

    toast('✓ ' + id.slice(0, 6) + '… saved → ' + targetStatus.toUpperCase(), 'success');
  } catch (e) {
    toast('Save failed: ' + e.message, true);
  } finally {
    busyIds.delete(id);
    renderDevices();
    renderStats();
    updateBulkBar();
  }
}

// ==========================================================
// SAVE ALL CHANGES
// ==========================================================
async function saveAllChanges() {
  if (isSavingAll || !FB_URL) return;
  const ids = Object.keys(pendingChanges);
  if (ids.length === 0) {
    toast('No pending changes');
    return;
  }

  isSavingAll = true;
  const saveBtn = document.getElementById('saveAllBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = '⏳ Saving (' + ids.length + ')...';

  let ok = 0, fail = 0;

  // Parallel saves — FAST
  await Promise.all(ids.map(async (id) => {
    const target = pendingChanges[id];
    try {
      const url = FB_URL + '/devices/' + id + '/adminStatus.json' + (FB_KEY ? '?auth=' + FB_KEY : '');
      const res = await fetch(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(target)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const dev = allDevices.find(x => x.id === id);
      if (dev) { dev.serverAdmin = target; dev.pendingAdmin = null; }
      delete pendingChanges[id];
      ok++;
    } catch (e) {
      fail++;
    }
  }));

  isSavingAll = false;
  saveBtn.disabled = true;
  saveBtn.textContent = '💾 Save All Changes';

  if (fail === 0) toast('✓ All ' + ok + ' saved!', 'success');
  else toast('✓ ' + ok + ' saved, ✗ ' + fail + ' failed', true);

  renderDevices();
  renderStats();
  updateBulkBar();
}

// ==========================================================
// DISCARD PENDING
// ==========================================================
function discardChanges() {
  pendingChanges = {};
  allDevices.forEach(d => { d.pendingAdmin = null; });
  loadDevices();
  toast('Changes discarded');
}

// ==========================================================
// CLEAR FORCE
// ==========================================================
async function clearForce(id) {
  if (!FB_URL) return;
  busyIds.add(id);
  delete pendingChanges[id];

  try {
    const url = FB_URL + '/devices/' + id + '/adminStatus.json' + (FB_KEY ? '?auth=' + FB_KEY : '');
    const res = await fetch(url, { method: 'DELETE' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    toast('✓ Reset — actual status showing', 'success');
  } catch (e) {
    toast('Reset failed: ' + e.message, true);
  } finally {
    busyIds.delete(id);
    setTimeout(() => loadDevices(), 300);
  }
}

// ==========================================================
// BULK BAR
// ==========================================================
function updateBulkBar() {
  const count = Object.keys(pendingChanges).length;
  const bar = document.getElementById('bulkBar');
  const pCount = document.getElementById('pendingCount');
  const saveBtn = document.getElementById('saveAllBtn');

  if (count > 0) {
    bar.style.display = 'flex';
    pCount.textContent = count;
    saveBtn.disabled = false;
    saveBtn.textContent = '💾 Save All (' + count + ')';
  } else {
    bar.style.display = 'none';
    saveBtn.disabled = true;
    saveBtn.textContent = '💾 Save All Changes';
  }
}

// ==========================================================
// MANUAL REFRESH
// ==========================================================
async function manualRefresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.disabled = true;
  try {
    await loadDevices();
    toast('✓ Refreshed', 'success');
  } finally {
    setTimeout(() => {
      btn.classList.remove('spinning');
      btn.disabled = false;
    }, 400);
  }
}

// ==========================================================
// HELPERS
// ==========================================================
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
function toast(msg, type) {
  const el = document.getElementById('toastEl');
  el.textContent = msg;
  el.className = 'toast show' + (type === 'success' ? ' success' : (type === 'err' ? ' err' : ''));
  clearTimeout(el._t);
  el._t = setTimeout(() => {
    el.className = 'toast' + (type === 'success' ? ' success' : (type === 'err' ? ' err' : ''));
  }, 2500);
}

document.getElementById('fbUrl').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
document.getElementById('fbKey').addEventListener('keydown', e => { if (e.key === 'Enter') connect(); });
</script>
